<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Weather App"
    />

    <title>Nick's Weather App</title>

    <link
      rel="icon"
      href="weather-icon.png"
    />

    <link
      rel="apple-touch-icon"
      href="weather-icon.png"
    />

    <meta
      name="theme-color"
      content="#2c3e50"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body class="bg-dark">
    <div class="min-vh-100 d-flex align-items-center justify-content-center px-5">
      <div style="max-width: 760px; width: 100%">

        <!-- City input and weather button -->
        <div class="bg-light border rounded-top text-center py-2">
          <div class="row justify-content-center align-items-center">
            <div class="col-12 col-md-6 mb-2 mb-md-0">
              <input
                id="txtCityInput"
                type="text"
                class="form-control"
                placeholder="Enter city name!"
              />
            </div>

            <div class="col-12 col-md-3">
              <button
                id="btnGetWeather"
                class="btn btn-primary w-100"
              >
                Get Weather
              </button>
            </div>
          </div>
        </div>

        <!-- Weather cards -->
        <div class="row justify-content-center mt-1 g-0">

          <!-- Current weather card -->
          <div class="col-11 col-md-6">
            <div class="card shadow-sm mt-0 py-5 h-100">
              <div class="card-body">
                <div class="row align-items-center text-center">
                  <div class="col-6">
                    <h1
                      id="txtCurrentTemp"
                      class="display-4 mb-0 text-nowrap"
                    >
                      72°F
                    </h1>

                    <p
                      id="txtCurrentCondition"
                      class="mb-0"
                    >
                      Clear Sky
                    </p>
                  </div>

                  <div class="col-6">
                    <i
                      id="txtCurrentIcon"
                      class="bi bi-sun-fill text-warning"
                      style="font-size: 70px"
                    ></i>
                  </div>
                </div>

                <hr />

                <div class="row text-center">
                  <div class="col-6">
                    <p id="txtHumidity">
                      Humidity: 55%
                    </p>
                  </div>

                  <div class="col-6">
                    <p id="txtWind">
                      Wind: 6 mph
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Forecast card -->
          <div class="col-11 col-md-6">
            <div class="card shadow-sm mt-0 py-5 h-100">
              <div class="card-body text-center">
                <h5 class="mb-4">
                  Upcoming Weather
                </h5>

                <div class="row align-items-center mb-3">
                  <div class="col-4">
                    <p class="mb-0">
                      Today
                    </p>
                  </div>

                  <div class="col-4">
                    <i class="bi bi-sun text-warning"></i>
                  </div>

                  <div class="col-4">
                    <p
                      id="txtTodayForecast"
                      class="mb-0"
                    >
                      72°F
                    </p>
                  </div>
                </div>

                <div class="row align-items-center mb-3">
                  <div class="col-4">
                    <p class="mb-0">
                      Tonight
                    </p>
                  </div>

                  <div class="col-4">
                    <i class="bi bi-moon-stars text-secondary"></i>
                  </div>

                  <div class="col-4">
                    <p
                      id="txtTonightForecast"
                      class="mb-0"
                    >
                      58°F
                    </p>
                  </div>
                </div>

                <div class="row align-items-center">
                  <div class="col-4">
                    <p class="mb-0">
                      Tomorrow
                    </p>
                  </div>

                  <div class="col-4">
                    <i class="bi bi-cloud-sun text-warning"></i>
                  </div>

                  <div class="col-4">
                    <p
                      id="txtTomorrowForecast"
                      class="mb-0"
                    >
                      70°F
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div class="bg-light border rounded-bottom text-center py-2 mt-1">
          <p class="text-muted mb-0">
            Weather data from
            <a
              href="https://open-meteo.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              Open-Meteo
            </a>
          </p>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      const cityInput = document.querySelector("#txtCityInput");
      const weatherButton = document.querySelector("#btnGetWeather");

      weatherButton.addEventListener("click", handleWeatherRequest);

      cityInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          handleWeatherRequest();
        }
      });

      function handleWeatherRequest() {
        const city = cityInput.value.trim();

        if (city === "") {
          Swal.fire({
            title: "City Name Required",
            text: "Please enter a city name to get the weather.",
            icon: "warning"
          });

          return;
        }

        getWeather(city);
      }

      function getWeather(city) {
        setLoadingState(true);

        const backendUrl =
          "/api/weather?city=" + encodeURIComponent(city);

        fetch(backendUrl)
          .then(async response => {
            const data = await response.json();

            if (!response.ok) {
              throw new Error(
                data.error || "Unable to retrieve weather information."
              );
            }

            return data;
          })
          .then(data => {
            updateWeatherDisplay(data);
          })
          .catch(error => {
            console.error("Weather request failed:", error);

            Swal.fire({
              title: "Unable to Get Weather",
              text: error.message,
              icon: "error"
            });
          })
          .finally(() => {
            setLoadingState(false);
          });
      }

      function updateWeatherDisplay(data) {
        cityInput.value = data.city;

        document.querySelector("#txtCurrentTemp").textContent =
          data.current.temperature_2m + "°F";

        document.querySelector("#txtHumidity").textContent =
          "Humidity: " +
          data.current.relative_humidity_2m +
          "%";

        document.querySelector("#txtWind").textContent =
          "Wind: " +
          data.current.wind_speed_10m +
          " mph";

        document.querySelector("#txtTodayForecast").textContent =
          data.daily.temperature_2m_max[0] +
          "°F";

        document.querySelector("#txtTonightForecast").textContent =
          data.daily.temperature_2m_min[0] +
          "°F";

        document.querySelector("#txtTomorrowForecast").textContent =
          data.daily.temperature_2m_max[1] +
          "°F";

        updateWeatherCondition(
          data.current.weather_code
        );
      }

      function updateWeatherCondition(weatherCode) {
        const conditionElement =
          document.querySelector("#txtCurrentCondition");

        const iconElement =
          document.querySelector("#txtCurrentIcon");

        if (weatherCode === 0) {
          conditionElement.textContent = "Clear Sky";
          iconElement.className =
            "bi bi-sun-fill text-warning";
        } else if (
          weatherCode >= 1 &&
          weatherCode <= 3
        ) {
          conditionElement.textContent = "Partly Cloudy";
          iconElement.className =
            "bi bi-cloud-sun-fill text-warning";
        } else if (
          weatherCode >= 45 &&
          weatherCode <= 48
        ) {
          conditionElement.textContent = "Foggy";
          iconElement.className =
            "bi bi-cloud-fog-fill text-secondary";
        } else if (
          weatherCode >= 51 &&
          weatherCode <= 67
        ) {
          conditionElement.textContent = "Rainy";
          iconElement.className =
            "bi bi-cloud-rain-fill text-primary";
        } else if (
          weatherCode >= 71 &&
          weatherCode <= 77
        ) {
          conditionElement.textContent = "Snowy";
          iconElement.className =
            "bi bi-snow text-info";
        } else if (
          weatherCode >= 80 &&
          weatherCode <= 82
        ) {
          conditionElement.textContent = "Rain Showers";
          iconElement.className =
            "bi bi-cloud-rain-heavy-fill text-primary";
        } else if (
          weatherCode >= 95 &&
          weatherCode <= 99
        ) {
          conditionElement.textContent = "Thunderstorm";
          iconElement.className =
            "bi bi-cloud-lightning-rain-fill text-warning";
        } else {
          conditionElement.textContent = "Unknown";
          iconElement.className =
            "bi bi-cloud-fill text-secondary";
        }

        iconElement.style.fontSize = "70px";
      }

      function setLoadingState(isLoading) {
        weatherButton.disabled = isLoading;

        weatherButton.textContent =
          isLoading
            ? "Loading..."
            : "Get Weather";
      }
    </script>
  </body>
</html>
